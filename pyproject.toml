[project]
name = "typeandlearn"
version = "0.1.0"
description = "Turn source texts into guided language-learning typing practice."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dotenv>=0.9.9",
    "nltk>=3.9.2",
    "pandas>=3.0.0",
    "tabulate>=0.9.0",
    "fastapi[standard]>=0.135.2",
    "sqlmodel>=0.0.38",
    "psycopg[binary]>=3.3.4",
    "spacy>=3.8.13,<3.9",
    "de-core-news-sm==3.8.0",
    "en-core-web-sm==3.8.0",
    "es-core-news-sm==3.8.0",
    "fr-core-news-sm==3.8.0",
    "it-core-news-sm==3.8.0",
    "pydantic-ai>=1.87.0",
    "beautifulsoup4>=4.15.0",
    "alembic>=1.14.0",
    "pyjwt>=2.8.0",
]

[tool.uv.sources]
de-core-news-sm = { url = "https://github.com/explosion/spacy-models/releases/download/de_core_news_sm-3.8.0/de_core_news_sm-3.8.0-py3-none-any.whl" }
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
es-core-news-sm = { url = "https://github.com/explosion/spacy-models/releases/download/es_core_news_sm-3.8.0/es_core_news_sm-3.8.0-py3-none-any.whl" }
fr-core-news-sm = { url = "https://github.com/explosion/spacy-models/releases/download/fr_core_news_sm-3.8.0/fr_core_news_sm-3.8.0-py3-none-any.whl" }
it-core-news-sm = { url = "https://github.com/explosion/spacy-models/releases/download/it_core_news_sm-3.8.0/it_core_news_sm-3.8.0-py3-none-any.whl" }

[tool.fastapi]
entrypoint = "apps/backend/main.py"

[dependency-groups]
dev = [
    "pyright>=1.1.410",
    "ruff>=0.16.7",
]

[tool.pyright]
extraPaths = ["apps/backend", "scripts"]

[tool.ruff]
exclude = ["archive"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"scripts/migrate.py" = ["E402"]
"tests/backend/test_text_repository.py" = ["E402"]
"tests/backend/test_owner_isolation.py" = ["E402"]
"tests/backend/test_auth.py" = ["E402"]
"tests/backend/test_analytics.py" = ["E402"]
"tests/backend/test_user_privacy.py" = ["E402"]
"tests/backend/test_logging_telemetry.py" = ["E402"]
"tests/backend/test_disaster_recovery.py" = ["E402"]
"apps/backend/alembic/env.py" = ["E402"]
