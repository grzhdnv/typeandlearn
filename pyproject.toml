[project]
name = "typeandlearn"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dotenv>=0.9.9",
    "nltk>=3.9.2",
    "pandas>=3.0.0",
    "tabulate>=0.9.0",
    "fastapi[standard]>=0.135.2",
    "sqlmodel>=0.0.38",
    "psycopg[binary]>=3.3.4",
    "spacy>=3.8.13",
    "pydantic-ai>=1.87.0",
]

[tool.fastapi]
entrypoint = "apps/backend/main.py"

[dependency-groups]
dev = [
    "pyright>=1.1.410",
]

[tool.pyright]
extraPaths = ["apps/backend"]

[tool.ruff]
exclude = ["archive"]

[tool.ruff.lint.per-file-ignores]
"scripts/migrate.py" = ["E402"]
"tests/backend/test_text_repository.py" = ["E402"]
