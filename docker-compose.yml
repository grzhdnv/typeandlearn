services:
  postgres:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    container_name: typeandlearn-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: typeandlearn
      POSTGRES_PASSWORD: typeandlearn
      POSTGRES_DB: typeandlearn_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U typeandlearn -d typeandlearn_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: typeandlearn-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://typeandlearn:typeandlearn@postgres:5432/typeandlearn_dev
      PORT: 8000
      EMBEDDED_WORKER_ENABLED: "false"
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: typeandlearn-worker
    restart: unless-stopped
    command: ["python", "apps/backend/worker.py"]
    environment:
      DATABASE_URL: postgresql+psycopg://typeandlearn:typeandlearn@postgres:5432/typeandlearn_dev
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: typeandlearn-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres18_data:
