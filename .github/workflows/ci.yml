name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup uv
        uses: astral-sh/setup-uv@1edb52594c857e2b5b13128931090f0640537287 # v5.3.0

      - name: Run Ruff Lint
        run: uv run ruff check apps/backend tests

  backend:
    name: Backend Checks & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.14"

      - name: Setup uv
        uses: astral-sh/setup-uv@1edb52594c857e2b5b13128931090f0640537287 # v5.3.0

      - name: Install dependencies
        run: uv sync --locked

      - name: Pyright Static Analysis
        run: uv run pyright

      - name: Run Backend Integration Tests
        run: uv run python -m unittest discover -s tests/backend -p 'test_*.py'

      - name: Compile Python
        run: uv run python -m compileall apps/backend

  migration:
    name: Database Migration Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.14"

      - name: Setup uv
        uses: astral-sh/setup-uv@1edb52594c857e2b5b13128931090f0640537287 # v5.3.0

      - name: Install dependencies
        run: uv sync --locked

      - name: Test Forward Migration
        run: uv run alembic upgrade head

      - name: Test Rollback Migration
        run: uv run alembic downgrade -1

      - name: Test Re-Upgrade Migration
        run: uv run alembic upgrade head

  postgresql:
    name: PostgreSQL 18 Acceptance
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: acceptance
          POSTGRES_PASSWORD: synthetic-test-only
          POSTGRES_DB: typeandlearn_acceptance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U acceptance -d typeandlearn_acceptance"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TYPEANDLEARN_TEST_POSTGRES_URL: postgresql+psycopg://acceptance:synthetic-test-only@127.0.0.1:5432/typeandlearn_acceptance
      DATABASE_URL: sqlite://
      GROQ_API_KEY: ""
      OPENROUTER_API_KEY: ""
      DEEPSEEK_API_KEY: ""
      EMBEDDED_WORKER_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.14"
      - name: Setup uv
        uses: astral-sh/setup-uv@1edb52594c857e2b5b13128931090f0640537287 # v5.3.0
      - name: Install dependencies
        run: uv sync --locked
      - name: Run Live PostgreSQL Acceptance
        run: uv run python -m unittest discover -s tests/postgresql -v

  frontend:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        run: npm --prefix apps/frontend ci

      - name: Frontend Quality Check
        run: npm --prefix apps/frontend run check

      - name: Run Frontend Unit Tests
        run: npm run test:frontend

  docker:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Build Backend Container
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: apps/backend/Dockerfile
          push: false

      - name: Build Frontend Container
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: apps/frontend/Dockerfile
          push: false

  checks:
    name: checks
    if: always()
    needs: [lint, backend, migration, postgresql, frontend, docker, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job failed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
      - name: All required jobs passed
        run: echo "All required jobs passed."

  e2e:
    name: Playwright End-to-End Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.14"

      - name: Setup uv
        uses: astral-sh/setup-uv@1edb52594c857e2b5b13128931090f0640537287 # v5.3.0

      - name: Setup Node
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: |
          uv sync --locked
          npm ci
          npm --prefix apps/frontend ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Tests
        run: npm run test:e2e
